name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: dotnet publish ./Rover/Rover.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: Zip it
        run: Compress-Archive -Path ./publish/* -DestinationPath Rover-win-x64.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: Rover-win-x64.zip
          generate_release_notes: true
